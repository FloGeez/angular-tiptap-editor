<!doctype html>
<html lang="en">
  <head>
    <title>Angular Tiptap Editor Demo - Modern Rich Text Editor</title>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Experience the power of Angular Tiptap Editor with this interactive demo. Modern rich text editing for Angular applications with full customization options." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <!-- Favicons -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Angular Tiptap Editor Demo" />
    <meta
      property="og:description"
      content="Modern rich text editing for Angular applications with full customization options." />
    <meta
      property="og:image"
      content="https://flogeez.github.io/angular-tiptap-editor/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://flogeez.github.io/angular-tiptap-editor/social-preview.png" />

    <!-- Material Design Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <app-root>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          font-family: &quot;Roboto&quot;, sans-serif;
          background: #fafafa;
        ">
        <img
          src="assets/logo/svg/logo-keys.svg"
          alt="/ATE — Angular Tiptap Editor"
          style="height: 48px; margin-bottom: 1.5rem" />
        <div
          style="
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #1d4ed8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
          "></div>
        <p style="color: #1d4ed8; font-size: 1.1rem; font-weight: 500; margin: 0">
          Loading Angular Tiptap Editor...
        </p>
      </div>
      <style>
        @keyframes spin {
          0% {
            transform: rotate(0deg);
          }

          100% {
            transform: rotate(360deg);
          }
        }
      </style>
    </app-root>
  </body>
</html>
