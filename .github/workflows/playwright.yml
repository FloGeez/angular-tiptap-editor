name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host

    strategy:
      fail-fast: false
      matrix:
        # WebKit is the slowest browser on Linux: its tests are split in two jobs that run side
        # by side, each on its own runner (own server, browser and clipboard), still one worker each
        include:
          - project: chromium
            shard: 1
            shards: 1
          - project: firefox
            shard: 1
            shards: 1
          - project: webkit
            shard: 1
            shards: 2
          - project: webkit
            shard: 2
            shards: 2

    name: test (${{ matrix.project }}${{ matrix.shards > 1 && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Run Playwright tests (${{ matrix.project }})
        env:
          HOME: /root
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}${{ matrix.shards > 1 && format('-{0}', matrix.shard) || '' }}
          path: playwright-report/
          retention-days: 14
