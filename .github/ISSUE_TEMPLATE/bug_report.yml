name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Library version
      description: Version of `@flogeez/angular-tiptap-editor` you use.
      placeholder: 3.6.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Angular and Tiptap versions
      placeholder: Angular 19.2, @tiptap/core 3.0
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Other
        - Not browser-specific
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A StackBlitz or repository link, or a minimal code snippet (component, config and content) that shows the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
